<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LinkBypass</title>
  </head>
  <body>
    <div id="app">
      <header class="header">
        <div class="header-left">
          <span class="logo-icon">↗</span>
          <span class="logo-text">LinkBypass</span>
          <span class="shortcut-hint" id="shortcutHint">⌘.</span>
        </div>
        <label class="toggle">
          <input type="checkbox" id="toggleInput" />
          <span class="toggle-track">
            <span class="toggle-thumb"></span>
          </span>
        </label>
      </header>
      <div class="status" id="statusText">Tap to toggle</div>
    </div>
    <script type="module" src="/src/popup/index.ts"></script>
  </body>
</html>
